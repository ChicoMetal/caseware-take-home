<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Security Architecture — Multi-Tenancy &amp; Authorization</text>

  <!-- Legend -->
  <g transform="translate(540, 52)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#dc2626" opacity="0.15" stroke="#dc2626" stroke-width="1"/>
    <text x="18" y="11" fill="#555" font-size="11">Security boundary</text>
    <rect x="140" y="0" width="12" height="12" rx="2" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>
    <text x="158" y="11" fill="#555" font-size="11">Domain service</text>
    <rect x="280" y="0" width="12" height="12" rx="2" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="298" y="11" fill="#555" font-size="11">Port interface</text>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- INFRASTRUCTURE LAYER (outer boundary)  -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="30" y="80" width="940" height="600" rx="10" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="100" font-size="11" font-weight="700" fill="#dc2626" letter-spacing="1.5">INFRASTRUCTURE LAYER</text>

  <!-- Auth Token Extraction -->
  <g>
    <rect x="60" y="120" width="200" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="160" y="145" text-anchor="middle" font-weight="600" fill="#991b1b">Auth Token Extraction</text>
    <text x="160" y="163" text-anchor="middle" font-size="11" fill="#dc2626">JWT / OAuth2 token</text>
    <text x="160" y="179" text-anchor="middle" font-size="11" fill="#dc2626">validated by infrastructure</text>
  </g>

  <!-- UserContext output -->
  <rect x="290" y="130" width="170" height="58" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="375" y="152" text-anchor="middle" font-weight="600" fill="#334155">UserContext</text>
  <text x="375" y="168" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">(userId, firmId, role)</text>
  <text x="375" y="182" text-anchor="middle" font-size="10" fill="#64748b">UUID v7 identifiers</text>

  <!-- Arrow: Auth → UserContext -->
  <line x1="260" y1="160" x2="282" y2="160" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- DOMAIN LAYER (inner boundary)          -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="60" y="220" width="880" height="440" rx="8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="240" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1.5">DOMAIN LAYER</text>

  <!-- ─────────────────── -->
  <!-- READ SIDE           -->
  <!-- ─────────────────── -->
  <rect x="80" y="260" width="400" height="380" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="282" font-size="11" font-weight="700" fill="#16a34a" letter-spacing="1">READ SIDE — Tenant-Scoped</text>

  <!-- UpdateStateResolver -->
  <rect x="100" y="296" width="360" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="318" text-anchor="middle" font-weight="600" fill="#1e40af">UpdateStateResolver</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#3b82f6">Receives UserContext — never inspects tokens</text>

  <!-- Security checks inside resolver -->
  <g>
    <rect x="100" y="372" width="170" height="52" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="185" y="393" text-anchor="middle" font-weight="600" font-size="11" fill="#991b1b">Role Check</text>
    <text x="185" y="410" text-anchor="middle" font-size="10" fill="#dc2626">ADMIN required for decisions</text>
  </g>
  <g>
    <rect x="290" y="372" width="170" height="52" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="375" y="393" text-anchor="middle" font-weight="600" font-size="11" fill="#991b1b">Tenant Isolation</text>
    <text x="375" y="410" text-anchor="middle" font-size="10" fill="#dc2626">firmId scopes all queries</text>
  </g>

  <!-- Read-side ports -->
  <g>
    <rect x="100" y="442" width="170" height="44" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="185" y="462" text-anchor="middle" font-weight="600" font-size="11" fill="#92400e">EngagementIndex</text>
    <text x="185" y="478" text-anchor="middle" font-size="10" fill="#b45309">Repository</text>
  </g>

  <!-- Port methods -->
  <rect x="100" y="498" width="360" height="56" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="112" y="516" font-size="10" fill="#475569" font-family="monospace">findByFirmId(firmId)</text>
  <text x="112" y="532" font-size="10" fill="#475569" font-family="monospace">findById(firmId, engagementId)</text>
  <text x="112" y="548" font-size="10" fill="#475569" font-family="monospace">updateState(firmId, engagementId, ...)</text>

  <!-- No cross-tenant label -->
  <rect x="100" y="564" width="360" height="28" rx="4" fill="#fef2f2" stroke="none"/>
  <text x="280" y="583" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">No cross-tenant methods — compile-time enforced</text>

  <!-- Audit Log port -->
  <g>
    <rect x="290" y="442" width="170" height="44" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="375" y="462" text-anchor="middle" font-weight="600" font-size="11" fill="#92400e">DecisionAuditLog</text>
    <text x="375" y="478" text-anchor="middle" font-size="10" fill="#b45309">record(response)</text>
  </g>

  <!-- ─────────────────── -->
  <!-- WRITE SIDE          -->
  <!-- ─────────────────── -->
  <rect x="500" y="260" width="420" height="380" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="282" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">WRITE SIDE — Cross-Tenant (Infrastructure Only)</text>

  <!-- TemplateUpdateProcessor -->
  <rect x="520" y="296" width="380" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="710" y="318" text-anchor="middle" font-weight="600" fill="#1e40af">TemplateUpdateProcessor</text>
  <text x="710" y="336" text-anchor="middle" font-size="11" fill="#3b82f6">No UserContext — system/event-driven only</text>

  <!-- Infrastructure auth boundary -->
  <rect x="520" y="372" width="380" height="52" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="710" y="393" text-anchor="middle" font-weight="600" font-size="11" fill="#991b1b">Infrastructure Authentication</text>
  <text x="710" y="410" text-anchor="middle" font-size="10" fill="#dc2626">mTLS on event bus / service account credentials</text>

  <!-- Write-side port -->
  <g>
    <rect x="520" y="442" width="190" height="44" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="615" y="462" text-anchor="middle" font-weight="600" font-size="11" fill="#92400e">TemplateLookup</text>
    <text x="615" y="478" text-anchor="middle" font-size="10" fill="#b45309">Repository</text>
  </g>

  <!-- Write-side port methods -->
  <rect x="520" y="498" width="380" height="40" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="532" y="516" font-size="10" fill="#475569" font-family="monospace">findByTemplateWithVersionBelow(templateId, ver)</text>
  <text x="532" y="532" font-size="10" fill="#dc2626" font-style="italic">Cross-tenant by design — queries all firms</text>

  <!-- Separation wall -->
  <line x1="490" y1="260" x2="490" y2="640" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,4"/>
  <g transform="translate(490, 600) rotate(-90)">
    <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626" letter-spacing="1">COMPILE-TIME BOUNDARY</text>
  </g>

  <!-- EngagementIndexRepository on write side (shared) -->
  <g>
    <rect x="730" y="442" width="170" height="44" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="815" y="462" text-anchor="middle" font-weight="600" font-size="11" fill="#92400e">EngagementIndex</text>
    <text x="815" y="478" text-anchor="middle" font-size="10" fill="#b45309">Repository (state write)</text>
  </g>

  <!-- Write-side additional note -->
  <rect x="520" y="550" width="380" height="62" rx="5" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="570" text-anchor="middle" font-weight="600" font-size="11" fill="#475569">Invocation restricted to:</text>
  <text x="710" y="588" text-anchor="middle" font-size="10" fill="#64748b">Event handlers (template publication)</text>
  <text x="710" y="602" text-anchor="middle" font-size="10" fill="#64748b">Scheduled reconciliation jobs</text>

  <!-- Arrow: UserContext → Resolver -->
  <path d="M 375,188 L 375,210 Q 375,220 365,220 L 280,220 Q 270,220 270,230 L 270,260" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Arrow: Auth → Client label -->
  <text x="510" y="155" text-anchor="middle" font-size="11" fill="#475569">API Gateway</text>
  <text x="510" y="170" text-anchor="middle" font-size="10" fill="#64748b">/api/firms/{firmId}/...</text>
  <line x1="460" y1="160" x2="500" y2="160" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Input Validation callout -->
  <rect x="570" y="120" width="200" height="58" rx="6" fill="#fff" stroke="#64748b" stroke-width="1"/>
  <text x="670" y="142" text-anchor="middle" font-weight="600" font-size="11" fill="#334155">Input Validation</text>
  <text x="670" y="158" text-anchor="middle" font-size="10" fill="#64748b">Objects.requireNonNull on all</text>
  <text x="670" y="172" text-anchor="middle" font-size="10" fill="#64748b">domain model compact constructors</text>

  <!-- UUID v7 callout -->
  <rect x="790" y="120" width="140" height="58" rx="6" fill="#fff" stroke="#64748b" stroke-width="1"/>
  <text x="860" y="142" text-anchor="middle" font-weight="600" font-size="11" fill="#334155">UUID v7 PKs</text>
  <text x="860" y="158" text-anchor="middle" font-size="10" fill="#64748b">Non-enumerable</text>
  <text x="860" y="172" text-anchor="middle" font-size="10" fill="#64748b">Time-ordered + 74 random bits</text>

  <!-- Generic Error Messages callout -->
  <rect x="60" y="598" width="400" height="26" rx="4" fill="#fef2f2" stroke="none"/>
  <text x="260" y="616" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Error messages never leak internal IDs: "Engagement not found", "Insufficient permissions"</text>
</svg>
