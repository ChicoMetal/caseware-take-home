<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1e293b">Template Update Notification — CQRS Architecture</text>

  <!-- Legend -->
  <g transform="translate(600, 48)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="38" y="12" fill="#555" font-size="11">Write path</text>
    <line x1="130" y1="8" x2="160" y2="8" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="168" y="12" fill="#555" font-size="11">Read path</text>
    <line x1="260" y1="8" x2="290" y2="8" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
    <text x="298" y="12" fill="#555" font-size="11">Event</text>
  </g>

  <!-- External Systems -->
  <g>
    <rect x="30" y="80" width="170" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="108" text-anchor="middle" font-weight="600" fill="#475569">Template DB</text>
    <text x="115" y="126" text-anchor="middle" font-size="11" fill="#64748b">All versions stored</text>
    <text x="115" y="140" text-anchor="middle" font-size="11" fill="#64748b">Quick retrieval by ID+ver</text>
  </g>
  <g>
    <rect x="30" y="480" width="170" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="508" text-anchor="middle" font-weight="600" fill="#475569">Engagement DB</text>
    <text x="115" y="526" text-anchor="middle" font-size="11" fill="#64748b">~1 min load per file</text>
    <text x="115" y="540" text-anchor="middle" font-size="11" fill="#64748b">(hard constraint)</text>
  </g>

  <!-- Event -->
  <rect x="30" y="195" width="170" height="40" rx="20" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="115" y="220" text-anchor="middle" font-weight="500" fill="#92400e">Template Published</text>

  <!-- Write Side -->
  <g>
    <rect x="280" y="170" width="260" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="290" y="188" font-size="10" font-weight="600" fill="#2563eb" letter-spacing="1">WRITE SIDE</text>
    <text x="410" y="212" text-anchor="middle" font-weight="600" fill="#1e40af">TemplateUpdateProcessor</text>
    <text x="410" y="230" text-anchor="middle" font-size="11" fill="#3b82f6">Computes diffs + summaries</text>
    <text x="410" y="246" text-anchor="middle" font-size="11" fill="#3b82f6">Materializes engagement state</text>
    <text x="410" y="262" text-anchor="middle" font-size="11" fill="#3b82f6">Reconciliation safety net</text>
  </g>

  <!-- Read Side -->
  <g>
    <rect x="280" y="410" width="260" height="100" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="290" y="428" font-size="10" font-weight="600" fill="#16a34a" letter-spacing="1">READ SIDE</text>
    <text x="410" y="452" text-anchor="middle" font-weight="600" fill="#166534">UpdateStateResolver</text>
    <text x="410" y="470" text-anchor="middle" font-size="11" fill="#22c55e">List engagements (index read)</text>
    <text x="410" y="486" text-anchor="middle" font-size="11" fill="#22c55e">Get details (store read)</text>
    <text x="410" y="502" text-anchor="middle" font-size="11" fill="#22c55e">Process decisions (index write)</text>
  </g>

  <!-- Stores -->
  <g>
    <rect x="620" y="170" width="260" height="70" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="750" y="195" text-anchor="middle" font-weight="600" fill="#854d0e">Engagement State</text>
    <text x="750" y="213" text-anchor="middle" font-size="11" fill="#a16207">Which engagements have pending</text>
    <text x="750" y="227" text-anchor="middle" font-size="11" fill="#a16207">updates and their current status</text>
  </g>
  <g>
    <rect x="620" y="290" width="260" height="70" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="750" y="315" text-anchor="middle" font-weight="600" fill="#854d0e">Change Summaries</text>
    <text x="750" y="333" text-anchor="middle" font-size="11" fill="#a16207">Human-readable descriptions of</text>
    <text x="750" y="347" text-anchor="middle" font-size="11" fill="#a16207">what changed between versions</text>
  </g>

  <!-- Ports (small labels) -->
  <g>
    <rect x="245" y="96" width="140" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="315" y="114" text-anchor="middle" font-size="10" fill="#64748b">TemplateDiffProvider</text>
  </g>
  <g>
    <rect x="245" y="305" width="155" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="322" y="323" text-anchor="middle" font-size="10" fill="#64748b">DiffSummaryTransformer</text>
  </g>
  <g>
    <rect x="245" y="370" width="155" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="322" y="388" text-anchor="middle" font-size="10" fill="#64748b">TemplateVersionProvider</text>
  </g>

  <!-- Angular Client -->
  <g>
    <rect x="620" y="430" width="260" height="90" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="750" y="458" text-anchor="middle" font-weight="600" fill="#9d174d">Angular Client</text>
    <text x="750" y="476" text-anchor="middle" font-size="11" fill="#ec4899">API → Store → Effects → Facade</text>
    <text x="750" y="492" text-anchor="middle" font-size="11" fill="#ec4899">Engagement list + Detail modal</text>
    <text x="750" y="508" text-anchor="middle" font-size="11" fill="#ec4899">Apply / Decline decisions</text>
  </g>

  <!-- Arrows: Event → Processor -->
  <line x1="200" y1="215" x2="272" y2="215" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>

  <!-- Arrows: Template DB → Port (DiffProvider) -->
  <line x1="200" y1="110" x2="237" y2="110" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Arrows: Port (DiffProvider) → Processor -->
  <line x1="315" y1="124" x2="315" y2="162" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Arrows: Processor → Transformer port -->
  <line x1="370" y1="270" x2="370" y2="297" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Arrows: Processor → Index (write) -->
  <line x1="540" y1="200" x2="612" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Arrows: Processor → Summary Store (write) -->
  <line x1="540" y1="250" x2="580" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Arrows: Resolver → Index (read) -->
  <line x1="540" y1="435" x2="640" y2="235" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#arrow-green)"/>

  <!-- Arrows: Resolver → Summary Store (read) -->
  <line x1="540" y1="460" x2="640" y2="340" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Arrows: Resolver → VersionProvider port -->
  <line x1="322" y1="398" x2="322" y2="402" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Arrows: Client → Resolver -->
  <line x1="620" y1="470" x2="548" y2="470" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Arrows: Engagement DB → Index (backfill) -->
  <path d="M 200,510 Q 450,560 620,230" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="570" text-anchor="middle" font-size="10" fill="#94a3b8">One-time backfill</text>

  <!-- Step numbers on write path -->
  <circle cx="230" cy="215" r="10" fill="#2563eb"/>
  <text x="230" y="219" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">1</text>

  <circle cx="560" cy="195" r="10" fill="#2563eb"/>
  <text x="560" y="199" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">2</text>

  <circle cx="560" cy="280" r="10" fill="#2563eb"/>
  <text x="560" y="284" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">3</text>

  <!-- Step numbers on read path -->
  <circle cx="590" cy="470" r="10" fill="#16a34a"/>
  <text x="590" y="474" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">A</text>

</svg>